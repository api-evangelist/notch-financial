description: >-
  Notch uses a sales-led, quote-based commercial model. Pricing for its
  accounts-receivable / accounts-payable automation platform and payment
  processing is not published as public self-serve tiers; prospects book a
  demo and receive custom pricing based on volume, products used, and payment
  processing rates. No public, machine-readable API plan or per-call pricing
  is documented. Values here are not reconciled.
notes: >-
  Notch markets competitive payment processing rates and per-product
  packaging but does not publish rate cards. Contact Notch sales for current
  pricing. Reconcile if Notch publishes public pricing.
sources:
- https://www.notch.financial
- https://www.notch.financial/products/payment-processing-software
plans:
- id: notch-financial-quote
  name: Custom (Sales-Led)
  type: enterprise
  description: >-
    Quote-based pricing for AR/AP automation, customer payment portals,
    payment collection / processing / reconciliation, and accounting / ERP
    integrations. Includes negotiated payment processing rates. Contact Notch
    sales for a demo and quote.
