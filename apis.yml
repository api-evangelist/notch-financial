    type: Documentation
  - url: openapi/notch-financial-openapi.yml
    type: OpenAPI
  description: Capability area covering creation, retrieval, and management of invoices
    and outstanding bills that customers can view and pay. Notch syncs invoice and
    collections data to connected accounting / ERP systems. No public endpoint
    reference is documented by Notch; modeled here as an unreconciled capability.
