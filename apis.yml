name: Notch
kind: company
description: Notch is an accounts-receivable and accounts-payable automation platform
  purpose-built for the food and beverage and wholesale distribution industry. It
  automates invoicing, payment collection, payment processing, and reconciliation,
  with branded customer payment portals, autopay, and dual-sync accounting / ERP
  integrations (QuickBooks, NetSuite, Xero, Microsoft Dynamics 365). Notch describes
  having an API available for integration, but does not publish a public developer
  reference; the API surfaces modeled here are derived from documented product
  capabilities and are not reconciled against an official specification.
