description: >-
  FinOps view of Notch spend. Notch is a sales-led AR/AP automation and B2B
  payments platform; it does not publish public per-call API pricing or
  self-serve plans. Spend is governed by a negotiated subscription plus
  payment-processing rates rather than metered API usage. With no public
  rate card or usage meters, cost attribution below is unreconciled and
  framed against documented product capabilities.
notes: >-
  Reconcile billing model, currency, and meters against a signed Notch
  agreement and invoice. Payment processing fees are negotiated and not
  publicly listed.
sources:
- https://www.notch.financial
- https://www.notch.financial/products/payment-processing-software
