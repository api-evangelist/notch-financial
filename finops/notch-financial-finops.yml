meters:
- name: platform_subscription
  description: Negotiated subscription for the AR/AP automation platform (not publicly priced).
  unit: contract
  aggregation: sum
  dimensions:
  - account
- name: payment_processing
  description: Payment processing fees on collected card and EFT/ACH payments (negotiated, not publicly priced).
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - method
principles:
- name: Visibility
  description: Obtain Notch invoices and processing statements; track subscription plus per-transaction processing fees.
- name: Allocation
  description: Map Notch spend to the AR/AP function and to payer/customer cohorts where processing fees apply.
- name: Optimization
  description: Negotiate processing rates by volume; drive customers to lower-cost EFT/ACH and autopay to reduce manual collection cost.
- name: Accountability
  description: Assign finance ownership; review subscription and processing fees against collections lift monthly.
